<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Super Machi</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Arial', sans-serif;
            background-color: #080809;
            overflow: hidden;
        }

        .premium-404-section {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated Background */
        .premium-404-section::before {
            content: "";
            position: absolute;
            inset: -5%; /* Slightly larger to allow for panning */
            background: url('https://images.unsplash.com/photo-1514933651103-005eec06c04b?q=80&w=2000&auto=format&fit=crop') center/cover no-repeat;
            z-index: 0;
            animation: bgPan 25s ease-in-out infinite alternate;
        }

        .error-bg-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(10, 10, 10, 0.9) 0%, rgba(10, 10, 10, 0.8) 100%);
            z-index: 1;
        }

        .error-content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 800px;
            padding: 0 20px;
            box-sizing: border-box;
            width: 100%;
        }

        .error-number-wrapper {
            margin-bottom: 5px;
            /* Entrance animation */
            opacity: 0;
            animation: fadeInDown 1s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .neon-404 {
            font-size: clamp(6rem, 25vw, 12rem);
            font-weight: 900;
            margin: 0;
            line-height: 1;
            background: linear-gradient(to bottom, #ff5e00, #ffb703);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Continuous floating animation */
            animation: float 4s ease-in-out infinite;
        }

        .error-title {
            font-size: clamp(1.8rem, 6vw, 2.5rem);
            color: #FFFFFF;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
            margin-bottom: 20px;
            line-height: 1.3;
            /* Entrance animation */
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.3s forwards;
        }

        .text-brandYellow {
            color: #FFB703 !important;
        }

        .error-desc {
            font-size: 1.1rem;
            color: #cccccc;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 450px;
            margin-left: auto;
            margin-right: auto;
            /* Entrance animation */
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.5s forwards;
        }

        .error-action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            /* Entrance animation */
            opacity: 0;
            animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) 0.7s forwards;
        }

        .btn {
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            padding: 16px 35px !important;
            border-radius: 50px !important;
            font-weight: 900 !important;
            font-size: 1.1rem !important;
            text-decoration: none !important;
            cursor: pointer !important;
            transition: all 0.3s ease !important;
            box-sizing: border-box;
        }

        .btn-royal-solid-red {
            background: #db3444 !important; 
            color: #FFF !important;
            border: none !important;
            /* Continuous pulsing animation */
            animation: pulseRed 2s infinite;
        }

        .btn-royal-solid-red:hover {
            background: #c52834 !important;
            transform: translateY(-4px) scale(1.02) !important;
            animation: none; /* Stop pulse on hover */
            box-shadow: 0 10px 20px rgba(219, 52, 68, 0.4);
        }

        .btn-outline-gold {
            background: transparent !important;
            color: #FFB703 !important;
            border: 2px solid #FFB703 !important;
        }

        .btn-outline-gold:hover {
            background: rgba(255, 183, 3, 0.1) !important;
            transform: translateY(-4px) scale(1.02) !important;
            box-shadow: 0 10px 20px rgba(255, 183, 3, 0.15);
        }

        /* --- KEYFRAMES FOR ANIMATIONS --- */

        @keyframes bgPan {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.08) translate(1%, 2%); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }

        @keyframes fadeInDown {
            0% { opacity: 0; transform: translateY(-30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulseRed {
            0% { box-shadow: 0 0 0 0 rgba(219, 52, 68, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(219, 52, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(219, 52, 68, 0); }
        }

        /* --- MOBILE RESPONSIVENESS --- */
        @media (max-width: 768px) {
            .error-content {
                padding: 0 15px;
            }

            .error-title {
                font-size: 1.6rem;
            }

            .error-desc {
                font-size: 1rem;
                margin-bottom: 30px;
                padding: 0 10px;
            }

            .error-action-buttons {
                flex-direction: column; 
                width: 100%;
                max-width: 350px;
                margin: 0 auto;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <section class="premium-404-section">

        <div class="error-bg-overlay"></div>

        <div class="container error-content text-center">

            <div class="error-number-wrapper">
                <h1 class="neon-404">404</h1>
            </div>

            <h2 class="error-title">OOPS! YOU SEEM TO<br>BE LOST<br><span class="text-brandYellow">FRIEND...</span></h2>

            <p class="error-desc">
                The page you are looking for has either been eaten by our hungry chef or no longer exists on our menu. 
                Let's get you back to the feast!
            </p>

            <div class="error-action-buttons">
                <a href="index.html" class="btn btn-royal-solid-red">
                    Back to Home <i class="fa-solid fa-house"></i>
                </a>

                <button onclick="goBack()" class="btn btn-outline-gold">
                    <i class="fa-solid fa-rotate-left"></i> Go Back
                </button>
            </div>

        </div>
    </section>

    <script>
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>

</html>
